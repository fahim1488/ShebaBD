<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShebaBD Auth Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #0B2E22;
            color: #F7F1E1;
        }
        .section {
            margin: 20px 0;
            padding: 20px;
            background: rgba(247,241,225,0.05);
            border-radius: 8px;
            border: 1px solid rgba(247,241,225,0.1);
        }
        button {
            background: #D6472C;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #B93B23;
        }
        input {
            background: rgba(247,241,225,0.1);
            border: 1px solid rgba(247,241,225,0.2);
            color: #F7F1E1;
            padding: 8px 12px;
            border-radius: 4px;
            margin: 5px;
            width: 200px;
        }
        .result {
            background: rgba(0,0,0,0.2);
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }
        .success { border-left: 4px solid #4ade80; }
        .error { border-left: 4px solid #f87171; }
    </style>
</head>
<body>
    <h1>🚀 ShebaBD Authentication System Test</h1>
    
    <div class="section">
        <h2>1. Backend Health Check</h2>
        <button onclick="testHealth()">Test Health Endpoint</button>
        <div id="healthResult" class="result"></div>
    </div>
    
    <div class="section">
        <h2>2. User Registration</h2>
        <input id="regName" placeholder="Full Name" value="Test User">
        <input id="regEmail" placeholder="Email" value="test@example.com">
        <input id="regPassword" type="password" placeholder="Password" value="password123">
        <select id="regRole">
            <option value="user">User</option>
            <option value="volunteer">Volunteer</option>
            <option value="ngo">NGO</option>
        </select>
        <br>
        <button onclick="testRegister()">Register</button>
        <div id="registerResult" class="result"></div>
    </div>
    
    <div class="section">
        <h2>3. User Login</h2>
        <input id="loginEmail" placeholder="Email" value="test@example.com">
        <input id="loginPassword" type="password" placeholder="Password" value="password123">
        <br>
        <button onclick="testLogin()">Login</button>
        <div id="loginResult" class="result"></div>
    </div>
    
    <div class="section">
        <h2>4. Profile Management</h2>
        <button onclick="testProfile()">Get Profile</button>
        <button onclick="testUpdateProfile()">Update Profile</button>
        <div id="profileResult" class="result"></div>
    </div>

    <script>
        const BASE_URL = 'http://localhost:8000/api/v1';
        let currentToken = null;

        async function apiCall(endpoint, options = {}) {
            try {
                const response = await fetch(`${BASE_URL}${endpoint}`, {
                    ...options,
                    headers: {
                        'Content-Type': 'application/json',
                        ...(currentToken && { 'Authorization': `Bearer ${currentToken}` }),
                        ...options.headers
                    }
                });
                
                const text = await response.text();
                let data;
                try {
                    data = JSON.parse(text);
                } catch {
                    data = { message: text };
                }
                
                return { status: response.status, data, ok: response.ok };
            } catch (error) {
                return { status: 0, data: { error: error.message }, ok: false };
            }
        }

        function displayResult(elementId, result, message = '') {
            const element = document.getElementById(elementId);
            const className = result.ok ? 'success' : 'error';
            element.className = `result ${className}`;
            element.textContent = `${message}\n\nStatus: ${result.status}\n\n${JSON.stringify(result.data, null, 2)}`;
        }

        async function testHealth() {
            const result = await apiCall('/health');
            displayResult('healthResult', result, '🏥 Testing backend health...');
        }

        async function testRegister() {
            const payload = {
                name: document.getElementById('regName').value,
                email: document.getElementById('regEmail').value,
                password: document.getElementById('regPassword').value,
                role: document.getElementById('regRole').value
            };
            
            const result = await apiCall('/auth/register', {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            
            if (result.ok && result.data.token) {
                currentToken = result.data.token;
            }
            
            displayResult('registerResult', result, '📝 Testing user registration...');
        }

        async function testLogin() {
            const payload = {
                email: document.getElementById('loginEmail').value,
                password: document.getElementById('loginPassword').value
            };
            
            const result = await apiCall('/auth/login', {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            
            if (result.ok && result.data.token) {
                currentToken = result.data.token;
            }
            
            displayResult('loginResult', result, '🔐 Testing user login...');
        }

        async function testProfile() {
            if (!currentToken) {
                displayResult('profileResult', { ok: false, status: 401, data: { error: 'Please login first' } }, '👤 Testing profile access...');
                return;
            }
            
            const result = await apiCall('/auth/me');
            displayResult('profileResult', result, '👤 Testing profile access...');
        }

        async function testUpdateProfile() {
            if (!currentToken) {
                displayResult('profileResult', { ok: false, status: 401, data: { error: 'Please login first' } }, '✏️ Testing profile update...');
                return;
            }
            
            const payload = {
                name: 'Updated Test User',
                avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&auto=format&fit=crop&q=80'
            };
            
            const result = await apiCall('/auth/profile', {
                method: 'PUT',
                body: JSON.stringify(payload)
            });
            
            displayResult('profileResult', result, '✏️ Testing profile update...');
        }

        // Auto-test health on page load
        window.addEventListener('load', testHealth);
    </script>
</body>
</html>
